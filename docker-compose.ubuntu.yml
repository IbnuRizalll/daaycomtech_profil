services:
  mysql:
    image: mysql:8.0
    container_name: daaycomtech-mysql-ubuntu
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_dct
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - mysql_ubuntu_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: daaycomtech-phpmyadmin-ubuntu
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

volumes:
  mysql_ubuntu_data:
